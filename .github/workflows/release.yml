name: release-bookworm

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Human-readable name'
        required: true
        default: 'BookwormPup64 CE'
      version:
        description: 'Version number'
        required: true
        default: '1.0'
      suffix:
        description: 'Release name suffix, with leading - (optional)'
        required: false
        default: ''
      arch:
        description: 'Architecture'
        type: choice
        options: [x86_64, x86]
        default: x86_64
      compat-distro:
        description: 'Compatible distro (target)'
        type: choice
        options: [debian, ubuntu]
        default: debian
      compat-distro-version:
        description: 'Compatible distro version'
        type: choice
        options: [bookworm64, jammy64, noble64]
        default: bookworm64
      kernel:
        description: 'Kernel version hint (not strictly enforced)'
        required: false
        default: '5.15.x'
      prefix:
        description: 'File name prefix for tag/release'
        required: false
        default: 'bookwormpup64ce'
      release:
        description: 'Upload release draft'
        type: boolean
        default: false
      runner:
        description: 'Build environment (GitHub runner)'
        type: choice
        options: [ubuntu-22.04, ubuntu-24.04]
        default: ubuntu-22.04

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ${{ inputs.runner }}
    env:
      NAME: ${{ inputs.name }}
      VER: ${{ inputs.version }}
      SUFFIX: ${{ inputs.suffix }}
      ARCH: ${{ inputs.arch }}
      COMPAT: ${{ inputs.compat-distro }}
      VERSTR: ${{ inputs.compat-distro-version }}
      KERNEL: ${{ inputs.kernel }}
      PREFIX: ${{ inputs.prefix }}
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show inputs
        run: |
          echo "ARCH=$ARCH COMPAT=$COMPAT VERSTR=$VERSTR Runner=${{ inputs.runner }}"

      - name: Validate distro/version combo
        shell: bash
        run: |
          set -e
          if [[ "$COMPAT" == "debian" && "$VERSTR" != "bookworm64" ]]; then
            echo "::error::debian must use bookworm64"; exit 1; fi
          if [[ "$COMPAT" == "ubuntu" && "$VERSTR" != "jammy64" && "$VERSTR" != "noble64" ]]; then
            echo "::error::ubuntu must use jammy64 or noble64"; exit 1; fi

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl dosfstools gawk git jq \
            mtools rsync squashfs-tools xorriso xz-utils zstd file wget

      - name: Confirm config path and spec file
        shell: bash
        run: |
          set -eux
          CFG="woof-distro/${ARCH}/${COMPAT}/${VERSTR}"
          [[ -d "$CFG" ]] || { echo "::error::Missing $CFG"; ls -1 "woof-distro/${ARCH}/${COMPAT}" || true; exit 1; }
          base="${VERSTR%64}"
          SPEC="$CFG/DISTRO_PKGS_SPECS-${COMPAT}-${base}"
          [[ -f "$SPEC" ]] || { echo "::error::Missing spec $SPEC"; exit 1; }
          echo "Using spec: $SPEC"
          grep -n '^.*abiword' "$SPEC" || true

      - name: Run merge2out
        shell: bash
        run: |
          set -eux
          CFG="woof-distro/${ARCH}/${COMPAT}/${VERSTR}"
          chmod +x ./merge2out
          yes "" | sudo -E ./merge2out "$CFG"

      - name: Generate SHA512 checksums
        if: always()
        shell: bash
        run: |
          set -eux
          rm -f SHA512checksums.txt
          find . -type f -name '*.sfs' -exec sha512sum {} \; > SHA512checksums.txt || true
          find . -type f -name '*.iso' -exec sha512sum {} \; >> SHA512checksums.txt || true
          cat SHA512checksums.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ github.run_number }}
          path: |
            **/*.iso
            **/*.sfs
            SHA512checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release (optional)
    needs: build
    if: inputs.release == true
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.workflow }}-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ github.run_number }}
          path: .
      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.prefix }}-${{ inputs.version }}${{ inputs.suffix }}
          tag_name: ${{ inputs.prefix }}-${{ inputs.version }}${{ inputs.suffix }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            *.iso
            *.sfs
            SHA512checksums.txt
