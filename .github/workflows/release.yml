name: release
on:
  workflow_dispatch:
    inputs:
      name:
        description: Human-readable name
        required: true
        default: BookwormPup64 CE
      version:
        description: Version number
        required: true
        default: "1.0"
      suffix:
        description: Release name suffix, with leading - (optional)
        required: false
        default: ""
      arch:
        description: Architecture (x86_64 or x86)
        required: true
        default: x86_64
      compat-distro:
        description: Compatible distro (debian or ubuntu)
        required: true
        default: debian
      compat-distro-version:
        description: Compatible distro version (bookworm64 / jammy64 / noble64)
        required: true
        default: bookworm64
      kernel:
        description: Kernel version hint (not strictly enforced)
        required: false
        default: 5.15.x
      prefix:
        description: File name prefix for tag/release
        required: false
        default: bookwarmpup64ce
      release:
        description: Upload release draft (true/false)
        required: false
        default: "false"
      runner:
        description: Build environment (ubuntu-22.04 or ubuntu-24.04)
        required: false
        default: ubuntu-22.04

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ${{ github.event.inputs.runner }}
    env:
      NAME: ${{ github.event.inputs.name }}
      VER: ${{ github.event.inputs.version }}
      SUFFIX: ${{ github.event.inputs.suffix }}
      ARCH: ${{ github.event.inputs.arch }}
      COMPAT: ${{ github.event.inputs.compat-distro }}
      VERSTR: ${{ github.event.inputs.compat-distro-version }}
      KERNEL: ${{ github.event.inputs.kernel }}
      PREFIX: ${{ github.event.inputs.prefix }}
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Checkout repo (branch you ran from)
        uses: actions/checkout@v4

      - name: Show inputs
        run: |
          echo "NAME=$NAME"
          echo "VER=$VER"
          echo "SUFFIX=$SUFFIX"
          echo "ARCH=$ARCH"
          echo "COMPAT=$COMPAT"
          echo "VERSTR=$VERSTR"
          echo "KERNEL=$KERNEL"
          echo "PREFIX=$PREFIX"
          echo "Runner=$(lsb_release -sd || true)"

      - name: Validate distro/version combo
        shell: bash
        run: |
          set -e
          if [[ "$COMPAT" == "debian" && "$VERSTR" != "bookworm64" ]]; then
            echo "::error::Invalid combo: debian must use bookworm64"
            exit 1
          fi
          if [[ "$COMPAT" == "ubuntu" && "$VERSTR" != "jammy64" && "$VERSTR" != "noble64" ]]; then
            echo "::error::Invalid combo: ubuntu must use jammy64 or noble64"
            exit 1
          fi

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl dosfstools gawk git jq \
            mtools rsync squashfs-tools xorriso xz-utils zstd file wget

      - name: Confirm config path and spec file
        shell: bash
        run: |
          set -eux
          CFG="woof-distro/${ARCH}/${COMPAT}/${VERSTR}"
          if [[ ! -d "$CFG" ]]; then
            echo "::error::Missing configuration directory: $CFG"
            echo "Available under woof-distro/${ARCH}/${COMPAT}:"
            ls -1 "woof-distro/${ARCH}/${COMPAT}" || true
            exit 1
          fi
          base="${VERSTR%64}"
          if [[ "$COMPAT" == "debian" ]]; then
            SPEC="$CFG/DISTRO_PKGS_SPECS-debian-${base}"
          else
            SPEC="$CFG/DISTRO_PKGS_SPECS-ubuntu-${base}"
          fi
          if [[ ! -f "$SPEC" ]]; then
            echo "::error::Expected spec file not found: $SPEC"
            exit 1
          fi
          echo "Using spec: $SPEC"
          head -n 10 "$SPEC" || true
          echo "Grepping for abiword rows (should be disabled if you used HARD variant):"
          grep -n '^.*abiword' "$SPEC" || true

      - name: Run merge2out
        shell: bash
        run: |
          set -eux
          CFG="woof-distro/${ARCH}/${COMPAT}/${VERSTR}"
          chmod +x ./merge2out
          yes "" | sudo -E ./merge2out "$CFG"

      - name: Locate build outputs
        id: findout
        shell: bash
        run: |
          set -eux
          mapfile -t ISOS < <(find . -type f -name '*.iso' | sort)
          mapfile -t SFS < <(find . -type f -name '*.sfs' | sort)
          echo "Found ISOs: ${#ISOS[@]}"
          printf '%s\n' "${ISOS[@]}" || true
          echo "Found SFS: ${#SFS[@]}"
          printf '%s\n' "${SFS[@]}" || true
          {
            echo "isos<<EOF"
            printf '%s\n' "${ISOS[@]}"
            echo "EOF"
            echo "sfses<<EOF"
            printf '%s\n' "${SFS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SHA512 checksums
        if: always()
        shell: bash
        run: |
          set -eux
          rm -f SHA512checksums.txt
          find . -type f -name '*.sfs' -exec sha512sum {} \; > SHA512checksums.txt || true
          find . -type f -name '*.iso' -exec sha512sum {} \; >> SHA512checksums.txt || true
          cat SHA512checksums.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.compat-distro }}-${{ github.event.inputs.compat-distro-version }}-${{ github.run_number }}
          path: |
            **/*.iso
            **/*.sfs
            SHA512checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release (optional)
    needs: build
    if: ${{ github.event.inputs.release == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.workflow }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.compat-distro }}-${{ github.event.inputs.compat-distro-version }}-${{ github.run_number }}
          path: .
      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.prefix }}-${{ github.event.inputs.version }}${{ github.event.inputs.suffix }}
          tag_name: ${{ github.event.inputs.prefix }}-${{ github.event.inputs.version }}${{ github.event.inputs.suffix }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            *.iso
            *.sfs
            SHA512checksums.txt
