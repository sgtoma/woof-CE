name: release-bookworm

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Human-readable name'
        required: true
        default: 'BookwormPup64 CE'
      version:
        description: 'Version number'
        required: true
        default: '1.0'
      suffix:
        description: 'Release name suffix, with leading - (optional)'
        required: false
        default: ''
      arch:
        description: 'Architecture'
        type: choice
        options: [x86_64, x86]
        default: x86_64
      compat-distro:
        description: 'Compatible distro (target)'
        type: choice
        options: [debian, ubuntu]
        default: debian
      compat-distro-version:
        description: 'Compatible distro version (match the distro!)'
        type: choice
        options: [bookworm64, jammy64, noble64]
        default: bookworm64
      kernel:
        description: 'Kernel version hint (not strictly enforced)'
        required: false
        default: '5.15.x'
      prefix:
        description: 'File name prefix for tag/release'
        required: false
        default: 'bookwormpup64ce'
      release:
        type: boolean
        description: 'Create a GitHub Release (needs repo permissions: Read/Write)'
        required: false
        default: false
      runner:
        type: choice
        description: 'Build environment (GitHub runner)'
        options: [ubuntu-22.04, ubuntu-24.04]
        default: ubuntu-22.04

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ${{ inputs.runner }}
    env:
      NAME: ${{ inputs.name }}
      VER: ${{ inputs.version }}
      SUFFIX: ${{ inputs.suffix }}
      ARCH: ${{ inputs.arch }}
      COMPAT: ${{ inputs.compat-distro }}
      VERSTR: ${{ inputs.compat-distro-version }}
      KERNEL: ${{ inputs.kernel }}
      PREFIX: ${{ inputs.prefix }}
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate distro/version combo
        shell: bash
        run: |
          set -e
          if [[ "$COMPAT" == "debian" && "$VERSTR" != "bookworm64" ]]; then
            echo "::error::Invalid combo: debian must use bookworm64"
            exit 1
          fi
          if [[ "$COMPAT" == "ubuntu" && "$VERSTR" != "jammy64" && "$VERSTR" != "noble64" ]]; then
            echo "::error::Invalid combo: ubuntu must use jammy64 or noble64"
            exit 1
          fi

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             bc bison build-essential ca-certificates cpio curl dosfstools gawk git jq             mtools rsync squashfs-tools xorriso xz-utils zstd file wget             patch bzip2 libncurses-dev

      - name: Build (merge2out + 0setup..3builddistro)
        shell: bash
        run: |
          set -euxo pipefail
          CFG="woof-distro/${ARCH}/${COMPAT}/${VERSTR}"
          if [[ ! -d "$CFG" ]]; then
            echo "::error::Missing configuration directory: $CFG"
            echo "Available under woof-distro/${ARCH}/${COMPAT}:"
            ls -1 "woof-distro/${ARCH}/${COMPAT}" || true
            exit 1
          fi
          chmod +x ./merge2out
          sudo -E ./merge2out "$CFG" </dev/null

          NAME="woof-out_${ARCH}_${ARCH}_${COMPAT}_${VERSTR}"
          OUT=""
          [[ -d "$NAME" ]] && OUT="$NAME"
          [[ -z "$OUT" && -d "../$NAME" ]] && OUT="../$NAME"
          [[ -z "$OUT" ]] && OUT="$(find . .. -maxdepth 2 -type d -name "$NAME" | head -n1 || true)"
          [[ -n "$OUT" && -d "$OUT" ]] || { echo "::error::Expected output dir not found: $NAME (tried . and ..)"; exit 1; }
          echo "Using OUT=$OUT"

          pushd "$OUT"
          sudo -E ./0setup </dev/null
          sudo -E ./1download </dev/null
          sudo -E ./2createpackages </dev/null
          sudo -E ./3builddistro </dev/null
          popd

          mkdir -p dist
          find "$OUT" -type f \( -name '*.iso' -o -name '*.sfs' \) -exec cp -v {} dist/ \;

      - name: Generate SHA512 checksums
        if: always()
        shell: bash
        run: |
          set -eux
          if [[ -d dist ]]; then
            cd dist
            rm -f SHA512checksums.txt
            find . -type f -name '*.sfs' -exec sha512sum {} \; > SHA512checksums.txt || true
            find . -type f -name '*.iso' -exec sha512sum {} \; >> SHA512checksums.txt || true
            cat SHA512checksums.txt || true
          else
            echo "dist/ not found; build likely failed earlier."
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ github.run_number }}
          path: |
            dist/*.iso
            dist/*.sfs
            dist/SHA512checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release (optional)
    needs: build
    if: inputs.release == true
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.workflow }}-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ github.run_number }}
          path: .
      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.prefix }}-${{ inputs.version }}${{ inputs.suffix }}
          tag_name: ${{ inputs.prefix }}-${{ inputs.version }}${{ inputs.suffix }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            *.iso
            *.sfs
            SHA512checksums.txt

